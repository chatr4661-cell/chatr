name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Grant execute permission for gradlew
      run: chmod +x android-native/gradlew
      
    - name: Build with Gradle
      id: gradle_build
      continue-on-error: true
      run: |
        cd android-native
        ./gradlew build -x test
        
    - name: Run tests
      if: steps.gradle_build.outcome == 'success'
      continue-on-error: true
      run: |
        cd android-native
        ./gradlew test
        
    - name: Build APK
      if: steps.gradle_build.outcome == 'success'
      continue-on-error: true
      run: |
        cd android-native
        ./gradlew assembleRelease || ./gradlew assembleDebug
        
    - name: Upload APK
      if: steps.gradle_build.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: |
          android-native/app/build/outputs/apk/release/*.apk
          android-native/app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
