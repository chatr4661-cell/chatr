name: iOS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Check for Xcode Project
      id: check_project
      run: |
        cd ios-native/CHATR
        if [ -d "CHATR.xcworkspace" ] || [ -d "CHATR.xcodeproj" ]; then
          echo "has_project=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning title=Xcode Project Missing::Notice: iOS native Xcode workspace/project not committed in repository; skipping native build."
          echo "has_project=false" >> "$GITHUB_OUTPUT"
        fi
        
    - name: Install dependencies
      if: steps.check_project.outputs.has_project == 'true'
      run: |
        cd ios-native/CHATR
        if [ -f "Podfile" ]; then
          pod install || true
        fi
        
    - name: Build
      if: steps.check_project.outputs.has_project == 'true'
      run: |
        cd ios-native/CHATR
        xcodebuild -workspace CHATR.xcworkspace -scheme CHATR -configuration Release clean build CODE_SIGNING_ALLOWED=NO
        
    - name: Run tests
      if: steps.check_project.outputs.has_project == 'true'
      run: |
        cd ios-native/CHATR
        xcodebuild test -workspace CHATR.xcworkspace -scheme CHATR -destination 'platform=iOS Simulator,name=iPhone 14'
