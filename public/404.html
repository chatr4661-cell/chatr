    <!-- Canonical-host safety and proactive Service Worker / cache self-healing -->
    <script>
      (function() {
        if (window.location.hostname === 'www.chatr.chat') {
          var canonicalUrl = new URL(window.location.href);
          canonicalUrl.hostname = 'chatr.chat';
          window.location.replace(canonicalUrl.toString());
          return;
        }

        function cleanLegacySWAndCaches() {
          try {
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                regs.forEach(function(reg) {
                  var url = (reg.active && reg.active.scriptURL) || (reg.installing && reg.installing.scriptURL) || (reg.waiting && reg.waiting.scriptURL) || '';
                  if (url.indexOf('firebase-messaging-sw.js') === -1) {
                    reg.unregister();
                  }
                });
              });
            }
            if ('caches' in window) {
              caches.keys().then(function(names) {
                names.forEach(function(name) {
                  if (name.indexOf('firebase') === -1) {
                    caches.delete(name);
                  }
                });
              });
            }
          } catch (e) {}
        }

        // Proactively unregister retired app-shell workers on boot
        cleanLegacySWAndCaches();

        // Proactive storage quota hygiene: ensure localStorage never chokes on auth tokens
        (function() {
          try {
            var probe = '__quota_probe__';
            var isFull = false;
            try {
              localStorage.setItem(probe, probe);
              localStorage.removeItem(probe);
            } catch (probeErr) {
              isFull = true;
            }

            if (isFull || localStorage.length > 25) {
              var toRemove = [];
              var nonEssential = ['ic_', 'chatr_brain_', 'chatrBrain_', 'airrunner_', 'recent_locations', 'recent_searches', 'chatr_search_suggestions', 'mood_entries', 'streaks', 'chatr_recent_activity', 'chatr_offline_'];
              for (var i = 0; i < localStorage.length; i++) {
                var k = localStorage.key(i);
                if (!k) continue;
                if (k.indexOf('auth-token') !== -1 || k.indexOf('sb-') !== -1 || k.indexOf('supabase') !== -1 || k.indexOf('firebase') !== -1) {
                  continue;
                }
                for (var j = 0; j < nonEssential.length; j++) {
                  if (k.indexOf(nonEssential[j]) === 0) {
                    toRemove.push(k);
                    break;
                  }
                }
              }
              for (var m = 0; m < toRemove.length; m++) {
                try { localStorage.removeItem(toRemove[m]); } catch (e) {}
              }
            }
          } catch (e) {}
        })();

        function triggerSelfHeal(reason) {
          var flag = 'chatr_heal_ts';
          var last = Number(sessionStorage.getItem(flag) || 0);
          var now = Date.now();
          if (now - last > 12000) {
            sessionStorage.setItem(flag, String(now));
            cleanLegacySWAndCaches();
            setTimeout(function() {
              window.location.reload();
            }, 100);
          }
        }

        // 1. Capture-phase resource load error handler (catches script/link net::ERR_FAILED or 404)
        window.addEventListener('error', function(e) {
          var target = e.target;
          if (target && (target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
            triggerSelfHeal('resource_load_failed');
            return;
          }
          var msg = (e && e.message ? e.message : '').toLowerCase();
          if (msg.indexOf('failed to load module script') !== -1 ||
              msg.indexOf('mime type') !== -1 ||
              msg.indexOf('failed to fetch dynamically imported module') !== -1 ||
              msg.indexOf('err_failed') !== -1) {
            triggerSelfHeal('script_eval_failed');
          }
        }, true);

        // 2. Unhandled rejection handler (catches dynamic import() network rejections)
        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason ? (e.reason.message || String(e.reason)) : '').toLowerCase();
          if (reason.indexOf('failed to fetch dynamically imported module') !== -1 ||
              reason.indexOf('dynamically imported module') !== -1 ||
              reason.indexOf('failed to fetch') !== -1 ||
              reason.indexOf('error loading dynamically imported module') !== -1) {
            triggerSelfHeal('dynamic_import_failed');
          }
        });
      })();
    </script>

    <script>
      // Handle install prompt globally
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
        console.log('PWA Install prompt ready');
        window.dispatchEvent(new CustomEvent('chatr:installpromptready', { detail: e }));
        
        // Expose helper on window
        window.showInstallPrompt = () => {
          if (window.deferredPrompt) {
            window.deferredPrompt.prompt();
            return window.deferredPrompt.userChoice.then((choice) => {
              console.log('User choice:', choice.outcome);
              window.deferredPrompt = null;
              return choice.outcome === 'accepted';
            });
          }
          return Promise.resolve(false);
        };
      });
      
      // Handle app installed
      window.addEventListener('appinstalled', () => {
        console.log('PWA installed successfully');
        window.deferredPrompt = null;
        window.dispatchEvent(new Event('chatr:appinstalled'));
      });
    </script>
